# Every package of the root module, every test in it, on the platforms the messaging code
# ships to. Build and test only: this repository's upstream CI never tags, releases or
# publishes (docs/RELEASING.md).
#
# The root module is the foundational packages, and they depend on neither connect nor the
# core SDK, so no sibling checkout is needed here. message/record_test.go reads this
# repository's own sdk/ directory, which every checkout has (until the messaging SDK moved in it
# read a sibling sdk checkout, in a job of its own that is retired). The sdk module's suites are
# sdk.yml's, and the native composition's native.yml's.
name: Test — message

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: go test (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out message
        uses: actions/checkout@v4

      # go.mod's toolchain line is the Go this module is built and tested with, and
      # mls's TestPinnedToolchain holds the test binary to it.
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: The module is verified and tidy
        run: |
          set -eu
          go mod verify
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # Linux checks out LF, so gofmt -l means something here (on a CRLF checkout it lists every
      # file). The control is a file gofmt must list; testdata fixtures are not formatted source.
      - name: gofmt
        run: |
          set -eu
          control=$(mktemp -d)
          printf '%s\n' 'package p' 'func  f( ) {}' > "$control/c.go"
          test -n "$(gofmt -l "$control")"
          unformatted=$(gofmt -l $(git ls-files '*.go' | grep -v '/testdata/'))
          if [ -n "$unformatted" ]; then echo "gofmt would rewrite:"; echo "$unformatted"; exit 1; fi

      # -count=1 defeats the test cache. No -run filter and no package filter: a filter is a
      # narrowing, and the suite is small enough to run whole (mls is the long pole).
      - name: Test
        run: go test -count=1 -timeout 30m ./...

      # The messaging packages are linked into the SDK's js/wasm build and the native libraries
      # for darwin and windows. mls/crossplatform_test.go builds nine platforms inside go test;
      # this is the explicit vet of the js test packages as well.
      - name: Platform builds
        run: |
          set -eu
          GOOS=darwin GOARCH=arm64 go build ./...
          GOOS=windows GOARCH=amd64 go build ./...
          GOOS=js GOARCH=wasm go build ./...
          GOOS=js GOARCH=wasm go vet ./...

  race:
    name: go test -race (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out message
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test with the race detector
        run: go test -race -count=1 -timeout 80m ./...

  windows:
    name: go test (windows, CRLF checkout)
    # The machines this project is developed on run core.autocrlf=true at system scope. Every
    # line-ending gate in mls and every CRLF fold in messagegroup was written because of that,
    # and this job is where they meet a real CRLF checkout -- so the first step proves the
    # checkout IS one, rather than assuming the runner's git is configured as it was last year.
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out message
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: The checkout is a CRLF checkout
        shell: bash
        run: |
          set -eu
          test "$(git config core.autocrlf)" = true || { echo "core.autocrlf is '$(git config core.autocrlf)', not true: this job would test an LF checkout"; exit 1; }
          # mls/GATES.md carries no eol attribute, so a CRLF checkout writes CR LF into it
          grep -q $'\r$' mls/GATES.md || { echo "mls/GATES.md holds no CRLF: the checkout did not convert"; exit 1; }
          # and a *.go file stays LF (.gitattributes pins it), which is what the gates rely on
          if grep -q $'\r$' mls/crossplatform_test.go; then echo "a .go file holds CRLF despite eol=lf"; exit 1; fi
      - name: Test
        run: go test -count=1 -timeout 50m ./...
