# The repository's own shape, held from the first commit on. MESSAGEREVIEW.md (connect
# 13ced4c8, "Repository layout" and "Final dependency boundary"):
#
#   - the root holds module metadata, documentation and CI, and no Go package or facade;
#   - the root module is the five foundational packages, which never depend on connect or on the
#     core SDK, so its go.mod requires neither.
#
# Each step carries its positive control in the same command, so that "found nothing" can only be
# printed by a check that was shown to find something. Build and test only: no step here tags,
# releases or publishes.
name: Repository — message

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  structure:
    name: repository structure
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out message
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: The module path is github.com/urnetwork/message
        run: |
          set -eu
          test "$(go list -m)" = "github.com/urnetwork/message"

      - name: The repository root holds no Go source
        run: |
          set -eu
          control=$(mktemp -d)
          touch "$control/facade.go"
          test "$(find "$control" -maxdepth 1 -name '*.go' | wc -l)" -eq 1
          found=$(find . -maxdepth 1 -name '*.go' | wc -l)
          echo "Go files at the repository root: $found"
          test "$found" -eq 0

      - name: The root module requires neither connect nor the core SDK
        run: |
          set -eu
          pattern='github\.com/urnetwork/(connect|sdk)([[:space:]]|/|$)'
          printf 'require github.com/urnetwork/connect v0.0.0\n' | grep -Eq "$pattern"
          printf 'require github.com/urnetwork/sdk v0.0.0\n' | grep -Eq "$pattern"
          if grep -En "$pattern" go.mod; then
            echo "go.mod names a core repository; the foundational packages must not depend on it"
            exit 1
          fi
          go mod verify

      # .github/scripts/siblings.sh is how every job gets a sibling checkout, so its refusals are
      # checked here: every pin in .github/siblings.txt passes them, and three pins it must refuse
      # (a fork URL, a branch name, a path escaping the organization) are refused.
      - name: The sibling pins are full commits from urnetwork, and a bad pin is refused
        run: |
          set -eu
          names=$(grep -Ev '^[[:space:]]*(#|$)' .github/siblings.txt | awk '{print $1}')
          test -n "$names"
          bash .github/scripts/siblings.sh --check $names
          bad=$(mktemp)
          for pin in \
            "sdk https://github.com/Ryanmello07/urnetwork-sdk.git 1ca8b35a43cfc00f5c4b8135470ab3347bd5c34e" \
            "sdk https://github.com/urnetwork/sdk.git main" \
            "sdk https://github.com/urnetwork/../Ryanmello07/urnetwork-sdk.git 1ca8b35a43cfc00f5c4b8135470ab3347bd5c34e"; do
            printf '%s\n' "$pin" > "$bad"
            if SIBLINGS_FILE="$bad" bash .github/scripts/siblings.sh --check sdk; then
              echo "siblings.sh accepted a pin it must refuse: $pin"
              exit 1
            fi
          done
