# The native library, URnetworkSdk: the core SDK's cgo package main with this repository's messaging
# half (sdk/cgo) laid beside it, the one library both halves ship in.
#
# Each job checks out the pinned siblings (.github/siblings.txt) -- connect; the core SDK at the
# head of the sdk pull request that removes messaging from it; glog, gvisor and goidenticons --
# then composes with sdk/cgo/compose.sh, regenerates the library's .def with sdk/cgo/gen and fails
# on any difference, builds the library with -buildmode=c-shared, holds its exports to the .def in
# both directions (.github/scripts/native-exports.sh), and runs the composed module's tests: the
# messaging exports' own tests in package main, and gen's (the .def and both headers against the
# exports, the loopback harness kept out of the shipping .def, MessageServiceUrls held to the core
# SDK's ServiceUrl).
#
# NOT HERE YET, named rather than left out silently: ctest/run.sh, whose C consumer links the
# LOOPBACK library (behind urnet_message_loopback, built with loopback.go.mod and an in-process
# message server), and the race library. They wait, with sdk/cp3b, for the message server's switch
# to this repository's packages; .github/scripts/module-census.sh lists loopback.go.mod as not yet
# wired.
name: Test — native library

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  library:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    name: compose, build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out message
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: sdk/cgo/go.mod

      - name: Check out the pinned siblings
        run: bash .github/scripts/siblings.sh connect sdk glog gvisor goidenticons

      - name: Compose the core SDK's cgo package main under sdk/cgo
        run: bash sdk/cgo/compose.sh

      # gen's TestTheDefNamesEveryHandWrittenExportThatShips holds the same property byte for byte
      # on every test run; this step names the file to regenerate when it fails.
      - name: The module is verified, and the library's .def is current
        working-directory: sdk/cgo
        run: |
          set -eu
          go mod verify
          go run ./gen
          git diff --exit-code -- include/urnetwork_sdk.def

      - name: Build the library
        working-directory: sdk/cgo
        env:
          CGO_ENABLED: "1"
        run: |
          set -eu
          mkdir -p build/library
          case "$(go env GOOS)" in
            windows) library=build/library/URnetworkSdk.dll ;;
            *) library=build/library/libURnetworkSdk.so ;;
          esac
          go build -trimpath -buildmode=c-shared -o "$library" .
          ls -l build/library
          echo "LIBRARY=$library" >> "$GITHUB_ENV"

      - name: The library's exports are the .def's names, both ways
        run: bash .github/scripts/native-exports.sh sdk/cgo "sdk/cgo/${LIBRARY%.*}.h" "sdk/cgo/$LIBRARY"

      - name: protobuf is one version in the root module, the SDK and the composition
        run: |
          set -eu
          root=$(go list -m google.golang.org/protobuf)
          sdk=$(go -C sdk list -m google.golang.org/protobuf)
          composition=$(go -C sdk/cgo list -m google.golang.org/protobuf)
          echo "root: $root; sdk: $sdk; composition: $composition"
          test "$root" = "$sdk"
          test "$root" = "$composition"

      - name: Vet and test the composed module
        working-directory: sdk/cgo
        env:
          CGO_ENABLED: "1"
        run: |
          set -eu
          go vet ./...
          go test -count=1 ./...
