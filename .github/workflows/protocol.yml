# The messaging schema's own checks, beyond `go test ./...` in test.yml:
#
# - regenerate: protocol/message.pb.go is generated, once, from protocol/message.proto. This job
#   regenerates it with the exact generator pair that produced the committed file and fails on
#   any difference, so a hand edit to the generated Go, or a .proto edit committed without its
#   regeneration, cannot land. The pair reproduced connect's committed message.pb.go byte for
#   byte, version stamp included (protoc 35.1, protoc-gen-go v1.36.11); the protoc archive is
#   pinned by the sha256 GitHub publishes for the release asset.
# - wire-golden: the corpus in protocol/testdata/wire-golden.tsv is emitted again from connect's
#   copy of the schema as it was before the schema left connect (the pinned sibling
#   connect-golden) and from this repository's, and the base lines must be the same bytes, each
#   corpus cross-decoding into the other build's types identically. This is the proof that the
#   move left every authenticated inner byte where it was; protocol/message_wiregolden_test.go
#   holds the corpus append-only on every test run.
# - frame-code-points: the names of the four frame code points, read as text from connect's
#   frame.proto at the pinned sibling `connect`, with the sibling required.
name: Test — protocol

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regenerate:
    name: regenerate and diff protocol/*.pb.go
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out message
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install protoc 35.1 (pinned by digest)
        run: |
          set -eu
          zip=protoc-35.1-linux-x86_64.zip
          curl -fsSLo "$RUNNER_TEMP/$zip" "https://github.com/protocolbuffers/protobuf/releases/download/v35.1/$zip"
          echo "6930ebf62bd4ea607b98fff052596c6ee564b9835b4ce172c75a3f53ae9d91b7  $RUNNER_TEMP/$zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/$zip" -d "$RUNNER_TEMP/protoc"
          echo "$RUNNER_TEMP/protoc/bin" >> "$GITHUB_PATH"

      - name: Install protoc-gen-go v1.36.11
        run: |
          set -eu
          GOBIN="$RUNNER_TEMP/gobin" go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          echo "$RUNNER_TEMP/gobin" >> "$GITHUB_PATH"

      - name: Regenerate
        run: |
          set -eu
          protoc --version | grep -qx 'libprotoc 35.1'
          protoc-gen-go --version | grep -qx 'protoc-gen-go v1.36.11'
          make -C protocol build

      # Control first: the diff below must be able to see a change, so one is made and seen.
      - name: The generated Go is exactly what is committed
        run: |
          set -eu
          printf '// control\n' >> protocol/message.pb.go
          if git diff --quiet -- protocol; then echo "the diff check cannot see a change"; exit 1; fi
          git checkout -- protocol/message.pb.go
          make -C protocol build
          git diff --exit-code -- protocol
          test -z "$(git status --porcelain -- protocol)"

  wire-golden:
    name: the wire corpus against connect's copy (pinned, pre-removal)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out message
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check out the pinned siblings
        run: bash .github/scripts/siblings.sh connect-golden
      - name: The emitter's own tests, under each schema
        working-directory: protocol/testdata/wiregolden
        run: |
          set -eu
          go mod verify
          go test -count=1 -tags orig .
          go test -count=1 -tags new .
      # base_lines and base_sha256 are protocol/message_wiregolden_test.go's wireGoldenBaseLines
      # and wireGoldenBaseSha256: the corpus connect's copy emitted, 197 items.
      - name: connect's copy emits the base lines, byte for byte, and each corpus cross-decodes
        working-directory: protocol/testdata/wiregolden
        run: |
          set -eu
          base_lines=197
          base_sha256=9b5772b7e5d57956ce54c491b311bf86b5b39565c2a87f6d9dc2ad09a8454edc
          go run -tags orig . emit > "$RUNNER_TEMP/orig.tsv"
          go run -tags new . emit > "$RUNNER_TEMP/new.tsv"
          head -n "$base_lines" ../wire-golden.tsv > "$RUNNER_TEMP/base.tsv"
          echo "$base_sha256  $RUNNER_TEMP/base.tsv" | sha256sum -c -
          cmp "$RUNNER_TEMP/base.tsv" "$RUNNER_TEMP/orig.tsv"
          # control: cmp must see a one-byte difference
          cp "$RUNNER_TEMP/orig.tsv" "$RUNNER_TEMP/orig.control"
          printf 'x' >> "$RUNNER_TEMP/orig.control"
          if cmp -s "$RUNNER_TEMP/base.tsv" "$RUNNER_TEMP/orig.control"; then echo "cmp cannot see a changed byte"; exit 1; fi
          # every base row is emitted by this repository too, byte for byte (the descriptor row
          # aside: it is held structurally, with the rest of the append-only rule, by
          # protocol/message_wiregolden_test.go on every test run)
          grep -v '^descriptor-without-go_package' "$RUNNER_TEMP/base.tsv" | sort > "$RUNNER_TEMP/base.rows"
          sort "$RUNNER_TEMP/new.tsv" > "$RUNNER_TEMP/new.rows"
          test -z "$(comm -23 "$RUNNER_TEMP/base.rows" "$RUNNER_TEMP/new.rows")"
          test "$(wc -l < "$RUNNER_TEMP/base.rows")" -eq $((base_lines - 1))
          # connect's bytes decode into this repository's types and re-encode identically, and
          # the base decodes into connect's
          go run -tags new . check "$RUNNER_TEMP/orig.tsv"
          go run -tags orig . check "$RUNNER_TEMP/base.tsv"

  frame-code-points:
    name: frame code-point names against connect's frame.proto (pinned)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out message
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check out the pinned siblings
        run: bash .github/scripts/siblings.sh connect
      - name: The names, with the sibling required
        env:
          URMESSAGE_REQUIRE_CONNECT_ROOT: "1"
        run: go test -count=1 -run 'CodePoint' -v ./protocol/
